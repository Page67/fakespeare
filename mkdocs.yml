site_name: 我的码农日志
site_description: 编程项目记录与技术分享
site_author: uki

theme:
  name: material
  language: zh
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: blue
      accent: blue
      toggle:
        icon: material/brightness-7
        name: 切换到暗色模式
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: blue
      accent: blue
      toggle:
        icon: material/brightness-4
        name: 切换到亮色模式
  features:
    - navigation.tabs           # 顶部标签导航
    - navigation.sections       # 侧边栏分组
    - navigation.expand         # 自动展开侧边栏
    - navigation.top            # 回到顶部按钮
    - search.suggest            # 搜索建议
    - search.highlight          # 搜索结果高亮
    - content.code.copy         # 代码块复制按钮
    - content.code.annotate     # 代码注解

plugins:
  - search
  - blog:
      authors: true               # 启用作者功能（布尔值）
      authors_file: authors.yml   # 从外部文件加载作者列表

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - tables
  - toc:
      permalink: true

nav:
  - 首页: index.md
  - 工作日志:
    - blog/index.md
  - 项目讲解:
    - project/index.md