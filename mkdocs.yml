site_name: 无限猴子打字机
site_description: 编程项目记录与技术分享
site_author: uki

theme:
  name: material
  language: zh
  logo: assets/logo.svg
  custom_dir: overrides          # ← 新增：启用自定义模板目录
  palette:
    - scheme: default
      primary: blue
      accent: blue
      toggle:
        icon: material/brightness-7
        name: 暗色模式
    - scheme: slate
      primary: blue
      accent: blue
      toggle:
        icon: material/weather-night
        name: 亮色模式
  features:
    - navigation.tabs
    - navigation.top
    - search.suggest
    - content.code.copy

extra_css:                       # ← 新增：加载首页样式
  - stylesheets/extra.css

extra_javascript:                # ← 首页动效：海面波光粒子 + 字母砸香蕉树（仅首页生效）
  - javascripts/hero-particles.js
  - javascripts/hero-letters.js

hooks:                           # ← 新增：构建时为每页注入最后修改时间（meta.mtime）
  - hooks.py

plugins:
  - search
  - tags:
      tags_file: tags.md          # 标签索引页（自动生成 /tags/）
  - blog:
      blog_dir: blog
  - blog:
      blog_dir: projects

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - toc:
      permalink: true

nav:
  - 首页: index.md
  - 日常记录: blog/index.md
  - 项目讲解: projects/index.md
