site_name: 无限猴子打字机
site_description: 编程项目记录与技术分享
site_author: uki

theme:
  name: material
  language: zh
  custom_dir: overrides          # ← 新增：启用自定义模板目录
  palette:
    - scheme: default
      primary: blue
      accent: blue
      toggle:
        icon: material/brightness-7
        name: 暗色模式
    - scheme: slate
      primary: blue
      accent: blue
      toggle:
        icon: material/brightness-4
        name: 亮色模式
  features:
    - navigation.tabs
    - navigation.top
    - search.suggest
    - content.code.copy

extra_css:                       # ← 新增：加载首页样式
  - stylesheets/extra.css

plugins:
  - search
  - blog

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - toc:
      permalink: true

nav:
  - 首页: index.md
  - 工作日志: blog/index.md
  - 项目讲解: project/index.md
