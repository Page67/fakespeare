{% extends "base.html" %}

<!--
  自定义首页模板：在导航栏下方插入一个 Hero 横幅。
  只需要改下面 <h1>、<p> 和两个按钮的文字 / 链接即可。
-->

{% block tabs %}
  {{ super() }}

  <section class="cl-hero">
    <div class="cl-hero__inner md-grid md-typeset">
      <div class="cl-hero__content">

        <!-- 大标题：改这里 -->
        <h1>记录每一行代码的成长</h1>

        <!-- 副标题：自动读取 mkdocs.yml 里的 site_description，也可以直接写死 -->
        <p>{{ config.site_description }}</p>

        <!-- 主按钮 -->
        <a href="{{ 'blog/' | url }}" class="md-button md-button--primary">
          开始阅读
        </a>

        <!-- 次按钮 -->
        <a href="{{ 'project/' | url }}" class="md-button">
          项目讲解
        </a>

      </div>
    </div>
  </section>
{% endblock %}
